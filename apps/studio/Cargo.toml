[package]
name = "picasso-suite"
description = "Picasso Suite, the desktop and web app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

build = "build.rs"

[[bin]]
name = "picasso-suite"
path = "src/main.rs"

[dependencies]
picasso-ui.workspace = true

# Agents.md: "Graphics: wgpu only, no glow". The desktop app draws with wgpu (Vulkan, Metal, DX12).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }  # MIT OR Apache-2.0
image.workspace = true
pollster = "0.4"  # Apache-2.0 OR MIT; eframe uses it too (the graphics check waits for the card)

# The same winit as eframe's, named to ask for X11 on a Wayland desktop (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }  # Apache-2.0

# The same winit as eframe's, named to ask for X11 on a Wayland desktop (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }  # Apache-2.0

# Exception, to be removed: the browser build still draws through WebGL2 (glow). A wgpu build
# for the web compiled but did not get past start-up in the test browser (see README).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }  # MIT OR Apache-2.0
log = "0.4"  # MIT OR Apache-2.0
wasm-bindgen = "0.2"  # MIT OR Apache-2.0
wasm-bindgen-futures = "0.4"  # MIT OR Apache-2.0
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlElement"] }  # MIT OR Apache-2.0

# Puts the icon into the .exe, for Explorer and the taskbar's pinned entry.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"  # MIT

[lints]
workspace = true

# Linux packages: the program and FFmpeg 7.1's libraries in /usr/lib/picasso-suite, started by a
# small script in /usr/bin (see .github/workflows/release.yml, which gathers the libraries and
# makes the smaller icons in dist/icons).
[package.metadata.deb]
name = "picasso-suite"
maintainer = "Picasso Suite contributors"
section = "video"
priority = "optional"
# winit opens the window's libraries at run time (they are not linked), so they are named here:
# X11 (used on Wayland desktops too, through XWayland, for dropped files) and Wayland.
depends = "libc6 (>= 2.35), libasound2t64 | libasound2, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6, libwayland-client0"
# libva and a VA-API driver give hardware video decoding and encoding; without them FFmpeg
# decodes on the processor and playback is much slower.
recommends = "libvulkan1, mesa-vulkan-drivers, libva2, libva-drm2, mesa-va-drivers"
# EGL is wgpu's fallback when there is no Vulkan; curl and pkexec are used by Help > Check for
# Updates, xdg-utils to open web pages.
suggests = "libegl1, curl, pkexec | policykit-1, xdg-utils"
extended-description = "Non-linear video editor with a DaVinci Resolve-style interface. FFmpeg is included. Not affiliated with Blackmagic Design."
assets = [
    ["../../target/release/picasso-suite", "usr/lib/picasso-suite/", "755"],
    ["../../dist/linux-lib/*", "usr/lib/picasso-suite/", "644"],
    ["../../dist/FFMPEG-LICENSE.txt", "usr/share/doc/picasso-suite/FFMPEG-LICENSE.txt", "644"],
    ["../../packaging/linux/picasso-suite.sh", "usr/bin/picasso-suite", "755"],
    ["../../target/release/picasso-bridge", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.fabox_os.PicassoSuite.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.fabox_os.PicassoSuite.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/io.github.fabox_os.PicassoSuite.xml", "usr/share/mime/packages/", "644"],
    ["../../assets/icon.png", "usr/share/icons/hicolor/256x256/apps/io.github.fabox_os.PicassoSuite.png", "644"],
    ["../../dist/icons/16.png", "usr/share/icons/hicolor/16x16/apps/io.github.fabox_os.PicassoSuite.png", "644"],
    ["../../dist/icons/32.png", "usr/share/icons/hicolor/32x32/apps/io.github.fabox_os.PicassoSuite.png", "644"],
    ["../../dist/icons/48.png", "usr/share/icons/hicolor/48x48/apps/io.github.fabox_os.PicassoSuite.png", "644"],
    ["../../dist/icons/64.png", "usr/share/icons/hicolor/64x64/apps/io.github.fabox_os.PicassoSuite.png", "644"],
    ["../../dist/icons/128.png", "usr/share/icons/hicolor/128x128/apps/io.github.fabox_os.PicassoSuite.png", "644"],
]

[package.metadata.generate-rpm]
name = "picasso-suite"
summary = "Non-linear video editor with a DaVinci Resolve-style interface"
# FFmpeg's libraries come with the package, so their requirements are not looked up.
auto-req = "no"
assets = [
    { source = "../../target/release/picasso-suite", dest = "/usr/lib/picasso-suite/picasso-suite", mode = "755" },
    { source = "../../dist/linux-lib/*", dest = "/usr/lib/picasso-suite/", mode = "644" },
    { source = "../../dist/FFMPEG-LICENSE.txt", dest = "/usr/share/doc/picasso-suite/FFMPEG-LICENSE.txt", mode = "644" },
    { source = "../../packaging/linux/picasso-suite.sh", dest = "/usr/bin/picasso-suite", mode = "755" },
    { source = "../../target/release/picasso-bridge", dest = "/usr/bin/picasso-bridge", mode = "755" },
    { source = "../../packaging/linux/io.github.fabox_os.PicassoSuite.desktop", dest = "/usr/share/applications/io.github.fabox_os.PicassoSuite.desktop", mode = "644" },
    { source = "../../packaging/linux/io.github.fabox_os.PicassoSuite.metainfo.xml", dest = "/usr/share/metainfo/io.github.fabox_os.PicassoSuite.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/io.github.fabox_os.PicassoSuite.xml", dest = "/usr/share/mime/packages/io.github.fabox_os.PicassoSuite.xml", mode = "644" },
    { source = "../../assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
    { source = "../../dist/icons/16.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
    { source = "../../dist/icons/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
    { source = "../../dist/icons/48.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
    { source = "../../dist/icons/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
    { source = "../../dist/icons/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.fabox_os.PicassoSuite.png", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
vulkan-loader = "*"
libva = "*"
curl = "*"

# Required by library name (soname), which Fedora and openSUSE both provide under their own
# package names. winit opens the window's libraries at run time, so they are listed by hand.
[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
"libasound.so.2()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"

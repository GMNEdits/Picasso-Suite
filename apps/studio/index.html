<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picasso Suite</title>
    <link data-trunk rel="rust" data-bin="picasso-suite" />
    <style>
      html, body { margin: 0; height: 100%; background: #121418; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #808794;
        font: 15px system-ui, sans-serif; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="picasso_canvas"></canvas>
    <div id="loading">Loading Picasso Suite...</div>
  </body>
</html>

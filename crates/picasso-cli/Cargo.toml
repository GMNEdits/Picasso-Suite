[package]
name = "picasso-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
picasso-core = { version = "0.0.1", path = "../picasso-core" }
picasso-interop = { version = "0.0.1", path = "../picasso-interop" }
picasso-media = { version = "0.0.1", path = "../picasso-media" }
picasso-render = { version = "0.0.1", path = "../picasso-render" }
serde_json = "1.0.154"

[[bin]]
name = "picasso"
path = "src/main.rs"

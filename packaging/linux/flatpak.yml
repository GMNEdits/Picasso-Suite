# Builds the Flatpak from the release files produced by CI (see .github/workflows/release.yml):
# the program, and FFmpeg 7.1's libraries beside it in /app/lib/picasso-suite.
app-id: io.github.fabox_os.PicassoSuite
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: picasso-suite
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  # Help > Check for Updates installs a new bundle with the host's flatpak.
  - --talk-name=org.freedesktop.Flatpak
  # Check for Updates asks GitHub for the latest release.
  - --share=network
modules:
  - name: picasso-suite
    buildsystem: simple
    build-commands:
      - install -Dm755 picasso-suite /app/lib/picasso-suite/picasso-suite
      - cp -a lib/. /app/lib/picasso-suite/
      - install -Dm644 FFMPEG-LICENSE.txt /app/share/licenses/picasso-suite/FFMPEG-LICENSE.txt
      - install -Dm755 picasso-bridge /app/bin/picasso-bridge
      - printf '#!/bin/sh\nexec /app/lib/picasso-suite/picasso-suite "$@"\n' > /app/bin/picasso-suite
      - chmod 755 /app/bin/picasso-suite
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.fabox_os.PicassoSuite.png
      - install -Dm644 io.github.fabox_os.PicassoSuite.desktop /app/share/applications/io.github.fabox_os.PicassoSuite.desktop
      - install -Dm644 io.github.fabox_os.PicassoSuite.metainfo.xml /app/share/metainfo/io.github.fabox_os.PicassoSuite.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/picasso-suite
      - type: file
        path: ../../target/release/picasso-bridge
      - type: dir
        path: ../../dist/linux-lib
        dest: lib
      - type: file
        path: ../../dist/FFMPEG-LICENSE.txt
      - type: file
        path: ../../assets/icon.png
      - type: file
        path: io.github.fabox_os.PicassoSuite.desktop
      - type: file
        path: io.github.fabox_os.PicassoSuite.metainfo.xml

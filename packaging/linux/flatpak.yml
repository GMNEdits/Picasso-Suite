# Builds the Flatpak from the release binaries produced by CI (see .github/workflows/release.yml).
app-id: io.github.fabox_os.PicassoSuite
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: picasso-suite
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  # FFmpeg comes prebuilt (BtbN's static GPL FFmpeg 8.1 build, downloaded by the release workflow into
  # packaging/linux/ffmpeg/), so the app works without FFmpeg on the host.
  - name: picasso-suite
    buildsystem: simple
    build-commands:
      - install -Dm755 picasso-suite /app/bin/picasso-suite
      - install -Dm755 picasso /app/bin/picasso
      - install -Dm755 ffmpeg /app/bin/ffmpeg
      - install -Dm755 ffprobe /app/bin/ffprobe
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.fabox_os.PicassoSuite.png
      - install -Dm644 io.github.fabox_os.PicassoSuite.desktop /app/share/applications/io.github.fabox_os.PicassoSuite.desktop
      - install -Dm644 io.github.fabox_os.PicassoSuite.metainfo.xml /app/share/metainfo/io.github.fabox_os.PicassoSuite.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/picasso-suite
      - type: file
        path: ../../target/release/picasso
      - type: file
        path: ffmpeg/ffmpeg
      - type: file
        path: ffmpeg/ffprobe
      - type: file
        path: ../../crates/picasso-app/assets/icon.png
      - type: file
        path: io.github.fabox_os.PicassoSuite.desktop
      - type: file
        path: io.github.fabox_os.PicassoSuite.metainfo.xml

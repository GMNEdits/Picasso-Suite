name: check
on:
  push:
    branches: ['ci-check-hotfix']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev
      - run: cargo test --workspace
      - name: Release notes for the hotfix tag contain only that version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          RELEASE_TAG=v0.2.0-hotfix
          ver="${RELEASE_TAG#v}"
          name="${ver//-/ }"
          awk -v n="$name" '{ sub(/\r$/, "") } /^## / { on = ($0 == "## " n || index($0, "## " n " —") == 1); next } on' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          grep -q "Preferences" RELEASE_NOTES.md
          ! grep -q "Sound during playback" RELEASE_NOTES.md

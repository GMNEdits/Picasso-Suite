name: release
on:
  push:
    tags: ['v*']
    # A push to a release-* branch builds every package as a check, without publishing.
    branches: ['release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to
        default: v0.2.1

# Packages are named after the release tag: tag v0.2.1 gives picasso-suite-0.2.1-*.
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'check' }}
  # The program links FFmpeg 7.1's libraries (ffmpeg-next 7.1). Windows and Linux build against
  # this BtbN build, pinned and checked against its SHA-256, and ship its libraries.
  FFMPEG_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10
  FFMPEG_NAME: ffmpeg-n7.1.5-12-g1fdbca85aa

jobs:
  # Built on Ubuntu 22.04 (glibc 2.35), for x86_64 and ARM64. Debian calls these amd64 and arm64,
  # rpm and AppImage x86_64 and aarch64.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, ffmpeg: linux64, deb: amd64, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, ffmpeg: linuxarm64, deb: arm64, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev imagemagick rpm desktop-file-utils
      - name: Download FFmpeg 7.1 (BtbN shared GPL build, checked against its SHA-256)
        run: |
          file="$FFMPEG_NAME-${{ matrix.ffmpeg }}-gpl-shared-7.1.tar.xz"
          curl -fsSL --retry 5 --retry-delay 5 -o "$file" "$FFMPEG_BASE/$file"
          curl -fsSL --retry 5 -o checksums.sha256 "$FFMPEG_BASE/checksums.sha256"
          grep " $file\$" checksums.sha256 | sha256sum -c -
          mkdir ffmpeg-linux
          tar -xJf "$file" --strip-components=1 -C ffmpeg-linux
          echo "FFMPEG_DIR=$PWD/ffmpeg-linux" >> "$GITHUB_ENV"
      # The program finds FFmpeg's libraries in its own folder ($ORIGIN). DT_RPATH (not RUNPATH)
      # also applies to the libraries those load.
      - run: cargo build --release -p picasso-suite -p picasso-bridge
        env:
          RUSTFLAGS: -C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN
      - name: Gather FFmpeg's libraries
        run: |
          mkdir -p dist/linux-lib
          for f in ffmpeg-linux/lib/lib*.so.*; do
            name=$(basename "$f")
            case "$name" in
              *.so.[0-9]|*.so.[0-9][0-9]) cp -L "$f" "dist/linux-lib/$name" ;;
            esac
          done
          ls -la dist/linux-lib
          # Every FFmpeg library the program needs must be found beside it.
          cp target/release/picasso-suite dist/linux-lib/
          ldd dist/linux-lib/picasso-suite
          # (A `! cmd` line does not stop a step, hence the if.)
          if ldd dist/linux-lib/picasso-suite | grep "not found"; then exit 1; fi
          rm dist/linux-lib/picasso-suite
          cp ffmpeg-linux/LICENSE.txt dist/FFMPEG-LICENSE.txt
      # The menus and docks ask for small icons too; they are made from the 256-pixel one.
      - name: Icons in more sizes
        run: |
          mkdir -p dist/icons
          for s in 16 32 48 64 128; do
            convert assets/icon.png -resize ${s}x${s} "dist/icons/$s.png"
          done
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: |
          NAME="picasso-suite-${RELEASE_TAG#v}"
          cargo deb -p picasso-suite --no-build -o "$NAME-${{ matrix.deb }}.deb"
          cargo generate-rpm -p apps/studio -o "$NAME-${{ matrix.arch }}.rpm"
          # The packages say the processor they were built for.
          test "$(dpkg-deb -f "$NAME-${{ matrix.deb }}.deb" Architecture)" = "${{ matrix.deb }}"
          test "$(rpm -qp --qf '%{ARCH}' "$NAME-${{ matrix.arch }}.rpm")" = "${{ matrix.arch }}"
      # The AppImage runs on most distributions without installing; it uses the same system
      # libraries as the .deb (window, sound, Vulkan) and carries FFmpeg's.
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          NAME="picasso-suite-${RELEASE_TAG#v}"
          ARCH=${{ matrix.arch }}
          curl -fsSL --retry 5 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$ARCH.AppImage"
          chmod +x appimagetool
          D=AppDir
          ID=io.github.fabox_os.PicassoSuite
          mkdir -p $D/usr/lib/picasso-suite $D/usr/bin $D/usr/share/applications
          cp target/release/picasso-suite dist/linux-lib/* $D/usr/lib/picasso-suite/
          cp target/release/picasso-bridge $D/usr/bin/
          cp dist/FFMPEG-LICENSE.txt $D/usr/lib/picasso-suite/
          cp packaging/linux/$ID.desktop $D/usr/share/applications/
          cp packaging/linux/$ID.desktop assets/icon.png $D/
          mv $D/icon.png $D/$ID.png
          for s in 16 32 48 64 128; do
            install -Dm644 dist/icons/$s.png $D/usr/share/icons/hicolor/${s}x${s}/apps/$ID.png
          done
          install -Dm644 assets/icon.png $D/usr/share/icons/hicolor/256x256/apps/$ID.png
          install -m755 packaging/linux/AppRun $D/AppRun
          ARCH=$ARCH ./appimagetool $D "$NAME-$ARCH.AppImage"
          "./$NAME-$ARCH.AppImage" --menu-status > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-${{ matrix.deb }}
          path: |
            *.deb
            *.rpm
            *.AppImage
      # The Flatpak job packs these same files.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-${{ matrix.deb }}
          path: |
            target/release/picasso-suite
            target/release/picasso-bridge
            dist/linux-lib
            dist/icons
            dist/FFMPEG-LICENSE.txt

  # Installs the .deb or .rpm on clean systems, which checks that every package it depends on
  # exists there, then starts the program. Where Xvfb and Mesa's software Vulkan (lavapipe) are
  # easy to get, the window is really opened and saves a picture of the Cut page.
  linux-install:
    needs: linux
    runs-on: ${{ matrix.runner }}
    # A rolling distribution can break by itself; it does not stop a release.
    continue-on-error: ${{ matrix.rolling || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', window: true, runner: ubuntu-latest, deb: amd64 }
          - { image: 'ubuntu:24.04', window: true, runner: ubuntu-latest, deb: amd64, appimage: true }
          - { image: 'debian:12', window: true, runner: ubuntu-latest, deb: amd64 }
          - { image: 'fedora:latest', window: true, runner: ubuntu-latest, deb: amd64 }
          - { image: 'opensuse/tumbleweed', window: false, runner: ubuntu-latest, deb: amd64, rolling: true }
          - { image: 'ubuntu:24.04', window: true, runner: ubuntu-24.04-arm, deb: arm64, appimage: true }
          - { image: 'fedora:latest', window: false, runner: ubuntu-24.04-arm, deb: arm64 }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-linux-${{ matrix.deb }}
          path: pkg
      - name: Install the package
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./pkg/*.deb
          elif command -v dnf >/dev/null; then
            dnf install -y ./pkg/*.rpm
          else
            zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm
          fi
      - name: The program and its libraries are found
        run: |
          if ldd /usr/lib/picasso-suite/picasso-suite | grep "not found"; then exit 1; fi
          picasso-suite --menu-status > /dev/null
          usage=$(picasso-bridge 2>&1 || true)
          echo "$usage" | grep -q usage
          # winit opens these when the window opens, so ldd cannot see them.
          for lib in libX11.so.6 libX11-xcb.so.1 libXcursor.so.1 libXrandr.so.2 libXi.so.6 \
                     libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0; do
            ldconfig -p | grep -q "$lib" || { echo "missing $lib"; exit 1; }
          done
      # Without FUSE in the container, the AppImage unpacks itself and runs from there.
      - name: The AppImage starts
        if: matrix.appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x pkg/*.AppImage
          cd pkg && ./*.AppImage --menu-status > /dev/null
      - name: The window opens
        if: matrix.window
        run: |
          if command -v apt-get >/dev/null; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb mesa-vulkan-drivers
          else
            dnf install -y xorg-x11-server-Xvfb mesa-vulkan-drivers
          fi
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # Which adapters draw (here Mesa's software Vulkan), the same report people send in.
          DISPLAY=:99 timeout 120 picasso-suite --graphics-check | tee graphics.txt
          DISPLAY=:99 PICASSO_SCREENSHOT=$PWD/cut.png timeout 180 picasso-suite --page=cut
          test -s cut.png
      - if: matrix.window
        uses: actions/upload-artifact@v4
        with:
          name: linux-window-${{ matrix.deb }}-${{ strategy.job-index }}
          path: |
            cut.png
            graphics.txt
          if-no-files-found: ignore

  # The x86_64 bundle keeps the name it always had (`picasso-suite-X.flatpak`); the ARM64 one is
  # `picasso-suite-X-aarch64.flatpak`. Each is built on a runner of its own processor from that
  # processor's files of the linux job.
  flatpak:
    needs: linux
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, deb: amd64, suffix: '' }
          - { runner: ubuntu-24.04-arm, arch: aarch64, deb: arm64, suffix: '-aarch64' }
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries-${{ matrix.deb }}
          path: .
      - run: |
          ls -la target/release dist dist/linux-lib dist/icons
          echo "PKG=picasso-suite-${RELEASE_TAG#v}${{ matrix.suffix }}" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.PKG }}.flatpak
          manifest-path: packaging/linux/flatpak.yml
          arch: ${{ matrix.arch }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-flatpak-${{ matrix.arch }}
          path: ${{ env.PKG }}.flatpak

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install ffmpeg@7 dylibbundler
      - run: |
          export PKG_CONFIG_PATH="$(brew --prefix ffmpeg@7)/lib/pkgconfig"
          cargo build --release -p picasso-suite -p picasso-bridge
      # Apple silicon only: Homebrew's FFmpeg on this runner is arm64.
      - run: |
          NAME="picasso-suite-${RELEASE_TAG#v}"
          APP="Picasso Suite.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp target/release/picasso-suite target/release/picasso-bridge "$APP/Contents/MacOS/"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s/0\.1\.0/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir icon.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          # FFmpeg and the libraries it needs go inside the app, so it runs without Homebrew.
          dylibbundler -of -b -cd \
            -x "$APP/Contents/MacOS/picasso-suite" \
            -d "$APP/Contents/Frameworks" -p @executable_path/../Frameworks/
          cp "$(brew --prefix ffmpeg@7)/LICENSE.md" "$APP/Contents/Resources/FFMPEG-LICENSE.md" || true
          codesign --force --deep -s - "$APP"
          otool -L "$APP/Contents/MacOS/picasso-suite"
          if otool -L "$APP/Contents/MacOS/picasso-suite" | grep -E "/opt/homebrew|/usr/local/"; then exit 1; fi
          ditto -c -k --keepParent "$APP" "$NAME-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: "*-macos-arm64.zip"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # bindgen reads FFmpeg's headers with libclang; LLVM 20 and later produce empty structs
      # for them, so LLVM 19 is installed.
      - name: LLVM 19
        shell: pwsh
        run: |
          choco install llvm --version=19.1.7 -y --no-progress --allow-downgrade --force
          & "C:\Program Files\LLVM\bin\clang.exe" --version
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # Puts the MSVC headers on INCLUDE, where libclang finds them.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Download FFmpeg 7.1 (BtbN shared GPL build, checked against its SHA-256)
        shell: pwsh
        run: |
          $file = "$env:FFMPEG_NAME-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest "$env:FFMPEG_BASE/$file" -OutFile $file -MaximumRetryCount 5 -RetryIntervalSec 5
          Invoke-WebRequest "$env:FFMPEG_BASE/checksums.sha256" -OutFile checksums.sha256 -MaximumRetryCount 5
          $want = (Select-String -Path checksums.sha256 -Pattern " $file$").Line.Split(" ")[0]
          $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "FFmpeg checksum mismatch: $got, expected $want" }
          Expand-Archive $file -DestinationPath ffmpeg-win
          $dir = (Get-ChildItem ffmpeg-win -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
      - run: cargo build --release -p picasso-suite -p picasso-bridge
      - shell: pwsh
        run: |
          $name = "picasso-suite-" + $env:RELEASE_TAG.TrimStart('v') + "-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/picasso-suite.exe, target/release/picasso-bridge.exe, README.md, CHANGELOG.md, LICENSE $name
          Copy-Item "$env:FFMPEG_DIR/bin/*.dll" $name
          Copy-Item "$env:FFMPEG_DIR/LICENSE.txt" "$name/FFMPEG-LICENSE.txt"
          Get-ChildItem $name | Format-Table Name, Length
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: "*-windows.zip"

  # Only when every package built and the Linux ones installed: it deletes the release's old
  # packages first, so a failed build must not leave the release with fewer.
  publish:
    if: ${{ success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    needs: [linux, linux-install, flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: pkg-*
          merge-multiple: true
      # A rebuild replaces the packages instead of adding next to the old ones.
      - name: Remove the release's old packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" -R "$GITHUB_REPOSITORY" -y
              done
          fi
      # The release notes are this version's section of CHANGELOG.md only, not the older versions.
      # Tag v0.2.0-hotfix reads the section "## 0.2.0 hotfix"; v0.1.0 reads "## 0.1.0 — first release".
      - name: Take this version's notes from the changelog
        run: |
          ver="${RELEASE_TAG#v}"
          name="${ver//-/ }"
          awk -v n="$name" '
            { sub(/\r$/, "") }
            /^## / { on = ($0 == "## " n || index($0, "## " n " —") == 1); next }
            on
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no section for $RELEASE_TAG (expected: ## $name)" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Picasso Suite ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: out/*

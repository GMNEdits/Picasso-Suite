name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to
        default: v0.1.0-hotfix

# Packages are named after the release tag: tag v0.1.0-hotfix gives picasso-suite-0.1.0-hotfix-*.
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo build --release --workspace
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: |
          NAME="picasso-suite-${RELEASE_TAG#v}"
          cargo deb -p picasso-app --no-build -o "$NAME-amd64.deb"
          cargo generate-rpm -p crates/picasso-app -o "$NAME-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: |
            *.deb
            *.rpm
      # The Flatpak job packs these same binaries.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            target/release/picasso-suite
            target/release/picasso

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: target/release
      - name: Download prebuilt FFmpeg (BtbN static GPL build, checked against its SHA-256)
        run: |
          file=ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL --retry 5 --retry-delay 5 -o "$file" "$base/$file"
          curl -fsSL --retry 5 -o checksums.sha256 "$base/checksums.sha256"
          grep " $file\$" checksums.sha256 | sha256sum -c -
          mkdir -p packaging/linux/ffmpeg
          tar -xJf "$file" --strip-components=2 -C packaging/linux/ffmpeg --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "PKG=picasso-suite-${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.PKG }}.flatpak
          manifest-path: packaging/linux/flatpak.yml
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-flatpak
          path: ${{ env.PKG }}.flatpak

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
      - run: |
          NAME="picasso-suite-${RELEASE_TAG#v}"
          APP="Picasso Suite.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for bin in picasso-suite picasso; do
            lipo -create -output "$APP/Contents/MacOS/$bin" \
              target/aarch64-apple-darwin/release/$bin target/x86_64-apple-darwin/release/$bin
          done
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          mkdir icon.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s crates/picasso-app/assets/icon.png --out icon.iconset/icon_${s}x${s}.png
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          lipo -info "$APP/Contents/MacOS/picasso-suite"
          ditto -c -k --keepParent "$APP" "$NAME-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: "*-macos-universal.zip"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      # FFmpeg goes in the zip next to picasso-suite.exe, so the app works right after unzipping.
      - name: Download FFmpeg for Windows (BtbN static GPL build, checked against its SHA-256)
        shell: pwsh
        run: |
          $file = "ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          Invoke-WebRequest "$base/$file" -OutFile $file -MaximumRetryCount 5 -RetryIntervalSec 5
          Invoke-WebRequest "$base/checksums.sha256" -OutFile checksums.sha256 -MaximumRetryCount 5
          $want = (Select-String -Path checksums.sha256 -Pattern " $file$").Line.Split(" ")[0]
          $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "FFmpeg checksum mismatch: $got, expected $want" }
          Expand-Archive $file -DestinationPath ffmpeg-win
      - shell: pwsh
        run: |
          $name = "picasso-suite-" + $env:RELEASE_TAG.TrimStart('v') + "-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/picasso-suite.exe, target/release/picasso.exe, README.md, CHANGELOG.md, LICENSE $name
          $bin = Get-ChildItem ffmpeg-win -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)/ffmpeg.exe", "$($bin.FullName)/ffprobe.exe" $name
          Copy-Item "$($bin.Parent.FullName)/LICENSE.txt" "$name/FFMPEG-LICENSE.txt"
          & "$name/ffmpeg.exe" -version | Select-Object -First 1
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: "*-windows.zip"

  publish:
    if: ${{ !cancelled() }}
    needs: [linux, flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: pkg-*
          merge-multiple: true
      # A rebuild replaces the packages instead of adding next to the old ones.
      - name: Remove the release's old packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" -R "$GITHUB_REPOSITORY" -y
              done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Picasso Suite ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: out/*
